name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Unit tests. tests/submissions-http.e2e.test.mjs skips unless E2E_* is set.
      # Do not add those secrets to this workflow.
      - run: npm test
